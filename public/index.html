<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Airecruitx - Google Sign-In Test</title>
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    button { padding: 10px 16px; font-size: 14px; cursor: pointer; margin-right: 8px; }
    textarea { width: 100%; height: 100px; margin-top: 8px; font-family: monospace; font-size: 12px; }
    pre { background: #f4f4f4; padding: 12px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>Google Sign-In Test</h2>
  <p>Fill in your Firebase <b>Web app</b> config below (Firebase Console → Project Settings → General → Your apps → Web app).</p>
  <textarea id="config" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'></textarea>

  <p>
    <button id="signInBtn">Sign in with Google</button>
    <button id="callBackendBtn">Send idToken to /api/auth/google</button>
  </p>

  <h4>ID Token (copy this into Postman)</h4>
  <textarea id="tokenOutput" readonly></textarea>

  <h4>Backend response</h4>
  <pre id="backendOutput">-</pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    let idToken = "";

    document.getElementById("signInBtn").addEventListener("click", async () => {
      try {
        const firebaseConfig = JSON.parse(document.getElementById("config").value);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const result = await signInWithPopup(auth, provider);
        idToken = await result.user.getIdToken();

        document.getElementById("tokenOutput").value = idToken;
      } catch (err) {
        document.getElementById("tokenOutput").value = "Error: " + err.message;
      }
    });

    document.getElementById("callBackendBtn").addEventListener("click", async () => {
      if (!idToken) {
        document.getElementById("backendOutput").textContent = "Sign in first to get an idToken.";
        return;
      }
      try {
        const res = await fetch("/api/auth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken, role: "candidate" }),
        });
        const data = await res.json();
        document.getElementById("backendOutput").textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        document.getElementById("backendOutput").textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
